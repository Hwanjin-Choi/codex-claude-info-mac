[package]
name = "codex-claude-info"
version = "0.1.0"
description = "Codex and Claude usage in the Windows system tray"
edition = "2021"

[lib]
name = "codex_claude_info_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
walkdir = "2"
